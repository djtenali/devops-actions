# ===============================================
# Write a workflow having dev -> staging > producion pipeline
# with approval gate on production
# Environments:
#   development -> no protection
#   staging     -> no protection
#   production  -> requiere reviewers: your github username 
#                   deployment branches: main only
# Finally i should be able to have summary
# development url :
# stagin url:
# production url:
# Docker build.
# image tag: commit sha value , in that only 7 characters should be printing  
# docker push   
# ===============================================
name: Build, Test and Push Docker Image - Reusable Workflow
on:
    workflow_call:
env: 
   DOCKER_IMAGE_NAME: 'djtenali/dashboard'
jobs: 
    #---------------------Job 1: Build and Package---------------------------
    Build:
      runs-on: ubuntu-latest
      outputs: 
        image-tag: ${{ steps.tag.outputs.value }}
      steps: 
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with: 
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Build,Test and Package
        run: mvn clean package 
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-artifact
          path: target/*.jar
          retention-days: 7
      - name: Docker Iamge Tag
        id: tag
        run: |
          echo " Creating Docker image tag"
          echo "value=${{github.sha}}" >> $GITHUB_OUTPUT
    #--------------------Job 2: Docker build and push-------------------
    Docker-build-push:
      name: Docker build and push
      runs-on: ubuntu-latest
      needs: Build
      steps: 
      - name: Checkout code
        uses: actions/checkout@v7    
      - name: Docker Build and Push
        uses: ./.github/actions/docker-build-push
        with: 
          registry-username: ${{vars.DOCKERHUB_USERNAME}}
          registry-password: ${{secrets.DOCKERHUB_TOKEN}}
          image-name: ${{ env.DOCKER_IMAGE_NAME }}
          image-tag: ${{ needs.Build.outputs.image-tag }}
    # ------------------------Job 3: Deploy to Dev-------------------------------------
    Deploy-dev: 
      name: Deploy to Dev
      runs-on: ubuntu-latest
      needs: [Build, Docker-build-push]
      environment:
        name: Development
        url: https://dev.djtenalidashboard.com
      steps:
      - name: Deploy to Development
        run: |
          echo "Deploying to Development Environment"
          echo "----------------------------------------"
          echo "Deployed  ✅"
    #---------------------------Job 4: Deploy to Stage----------------------------------
    Deploy-stage: 
      name: Deploy to Stage
      runs-on: ubuntu-latest
      needs: [Build, Docker-build-push, Deploy-dev]
      environment:
        name: Staging
        url: https://stage.djtenalidashboard.com
      steps:
      - name: Deploy to Staging
        run: |
          echo "Deploying to Staging Environment"
          echo "----------------------------------------"
          echo "Deployed  ✅"
    #---------------------------Job 5: Deploy to Prod (manually, required Approval)-----------------
    Deploy-prod: 
      name: Deploy to Production
      runs-on: ubuntu-latest
      needs: [Build, Docker-build-push, Deploy-dev, Deploy-stage ]
      environment:
        name: Production
        url: https://prod.djtenalidashboard.com
      steps:
      - name: Deploy to Production
        run: |
          echo "Deploying to Production Environment"
          echo "----------------------------------------"
          echo "Deployed  ✅" 
    Summary:
      name: Deployment Summary
      runs-on: ubuntu-latest
      needs: [Build, Docker-build-push, Deploy-dev, Deploy-stage, Deploy-prod]
      if: always()
      steps: 
      - name:  Overall Summary
        run: |
         echo "Deployment Summary" >> $GITHUB_STEP_SUMMARY
         echo "| Environment   | Status  |  URL   |" >> $GITHUB_STEP_SUMMARY
         echo "|----------------|---------|--------|" >> $GITHUB_STEP_SUMMARY
         echo "| Development   | ${{ needs.Deploy-dev.result}} | https://dev.djtenalidashboard.com |" >> $GITHUB_STEP_SUMMARY
         echo "| Staging        | ${{ needs.Deploy-stage.result}} | https://stage.djtenalidashboard.com |" >> $GITHUB_STEP_SUMMARY
         echo "| Production    | ${{ needs.Deploy-prod.result}} | https://prod.djtenalidashboard.com |" >> $GITHUB_STEP_SUMMARY

